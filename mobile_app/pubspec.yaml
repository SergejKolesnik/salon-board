name: salon_board_mobile
description: Read-only offline prototype for Salon Board Mobile v2.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.1
  dio: ^5.7.0
  intl: ^0.20.1
  path: ^1.9.0
  package_info_plus: ^8.1.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#121214"
  adaptive_icon_foreground: assets/branding/app_icon.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#121214"
  image: assets/branding/splash_logo.png
  android: true
  android_12:
    color: "#121214"
    image: assets/branding/splash_logo.png
