services:
  - type: web
    name: salon-board
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: WITHINGS_CLIENT_ID
        sync: false
      - key: WITHINGS_CLIENT_SECRET
        sync: false
      - key: WITHINGS_REDIRECT_URI
        sync: false
      - key: WITHINGS_TOKEN_ENCRYPTION_KEY
        sync: false
